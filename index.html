  --muted:#687386;
  --border:#e3e8f0;
  --primary:#2563eb;
  --primary-hover:#1d4ed8;
  --soft:#eef5ff;
  --green:#059669;
  --red:#dc2626;
  --yellow:#d97706;
  --shadow:0 8px 28px rgba(15,23,42,.055);
  --shadow-hover:0 12px 34px rgba(15,23,42,.09);
}
[data-theme="dark"]{
  --bg:#090f1d;
  --card:#111827;
  --text:#f4f7fb;
  --muted:#98a3b5;
  --border:#263246;
  --primary:#60a5fa;
  --primary-hover:#93c5fd;
  --soft:#172554;
  --green:#34d399;
  --red:#f87171;
  --yellow:#fbbf24;
  --shadow:0 8px 28px rgba(0,0,0,.22);
  --shadow-hover:0 12px 34px rgba(0,0,0,.32);
}

html,body{
  background:var(--bg);
  color:var(--text);
}

body{
  font-family:Inter,-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Segoe UI",sans-serif;
  letter-spacing:-.012em;
}

/* Desktop navigation */
aside{
  width:252px;
  padding:24px 16px;
  background:color-mix(in srgb,var(--card) 97%,var(--bg));
  border-right:1px solid var(--border);
  box-shadow:4px 0 24px rgba(15,23,42,.025);
}
.brand{
  padding:7px 10px 26px;
  font-size:20px;
  letter-spacing:-.025em;
}
.brand svg{width:21px;height:21px;stroke-width:2.1}
nav button{
  min-height:44px;
  padding:11px 13px;
  margin:3px 0;
  border-radius:12px;
  font-size:13px;
  font-weight:500;
  transition:background .15s ease,color .15s ease,transform .15s ease;
}
nav button svg{width:18px;height:18px;stroke-width:1.9}
nav button:hover{transform:none}
nav button.active{
  font-weight:650;
  box-shadow:inset 3px 0 0 var(--primary);
}

/* Main content */
main{
  margin-left:252px;
  width:calc(100% - 252px);
  max-width:1580px;
  padding:34px 36px;
}
.topbar{
  margin-bottom:26px;
}
h1{
  font-size:30px;
  line-height:1.15;
  font-weight:700;
  letter-spacing:-.04em;
}
.subtitle{
  font-size:13px;
  line-height:1.5;
}

/* Buttons */
.btn,.icon-btn,.theme-btn{
  border-radius:11px;
  transition:transform .15s ease,box-shadow .15s ease,background .15s ease,border-color .15s ease;
}
.btn{
  min-height:40px;
  padding:9px 14px;
  font-size:13px;
  font-weight:600;
}
.btn.primary{
  box-shadow:0 5px 14px color-mix(in srgb,var(--primary) 20%,transparent);
}
.btn.primary:hover{
  background:var(--primary-hover);
  border-color:var(--primary-hover);
  transform:translateY(-1px);
}
.icon-btn{
  min-width:36px;
  min-height:36px;
}
.icon-btn:hover{
  background:var(--soft);
  border-color:color-mix(in srgb,var(--primary) 28%,var(--border));
}

/* Summary cards */
.cards{
  gap:14px;
}
.cards>.card{
  min-width:0;
}
.card{
  padding:20px;
  border-radius:18px;
  border-color:var(--border);
  box-shadow:var(--shadow);
  transition:box-shadow .18s ease,border-color .18s ease,transform .18s ease;
}
.card:hover{
  border-color:color-mix(in srgb,var(--primary) 12%,var(--border));
}
.stat-label{
  font-size:12px;
  font-weight:550;
  letter-spacing:0;
}
.stat-value{
  margin-top:8px;
  font-size:25px;
  line-height:1.15;
  font-weight:500;
  letter-spacing:-.03em;
}

/* Section hierarchy */
.section-grid{
  gap:16px;
  margin-top:16px;
}
.section-title{
  margin-bottom:14px;
  font-size:15px;
  font-weight:700;
  letter-spacing:-.018em;
}
.small{
  line-height:1.45;
}

/* Accounts */
.account{
  padding:12px;
  border-radius:13px;
  background:color-mix(in srgb,var(--card) 97%,var(--soft));
}
.account:hover{
  border-color:color-mix(in srgb,var(--primary) 20%,var(--border));
}
.account-icon{
  width:38px;
  height:38px;
  border-radius:11px;
}
.amount{
  font-weight:500;
  letter-spacing:-.02em;
}

/* Forms */
.form-grid{gap:14px}
.field label{
  font-size:11px;
  font-weight:600;
  letter-spacing:.01em;
  text-transform:none;
}
.field input,.field select{
  min-height:42px;
  padding:10px 12px;
  border-radius:11px;
  transition:border-color .15s ease,box-shadow .15s ease;
}
.field input:focus,.field select:focus{
  border-color:var(--primary);
  box-shadow:0 0 0 3px color-mix(in srgb,var(--primary) 12%,transparent);
}
.form-actions{margin-top:16px}

/* Tables */
.table-wrap{
  width:100%;
  max-width:100%;
}
.table{
  width:100%;
  border-collapse:separate;
  border-spacing:0;
}
.table th,.table td{
  padding:12px 10px;
  border-bottom:1px solid var(--border);
  font-size:12px;
}
.table th{
  font-size:11px;
  font-weight:650;
  letter-spacing:.01em;
  color:var(--muted);
}
.table tbody tr:last-child td{border-bottom:0}
.table tbody tr:hover td{
  background:color-mix(in srgb,var(--soft) 45%,transparent);
}
.badge{
  padding:4px 8px;
  font-size:10px;
  font-weight:600;
}

/* Dashboard recent activity + category panel */
.recent-overview-grid{
  gap:22px;
}
.category-overview{
  padding-left:20px;
}
.category-overview-title{
  font-size:13px;
  margin-bottom:13px;
}
.category-item{
  margin-bottom:12px;
}
.category-item-top{
  font-size:12px;
}
.category-bar{
  height:6px;
}

/* Quick actions */
.quick-grid{gap:11px}
.quick-btn{
  min-height:108px;
  border-radius:15px;
  padding:14px 11px;
  box-shadow:none;
}
.quick-btn strong{
  font-size:13px;
  font-weight:650;
}
.quick-btn .small{font-size:10px}

/* DealPlug card */
.dealplug-dashboard-card{
  overflow:hidden;
}
.dealplug-dashboard-card .stat-value{
  font-size:24px;
}

/* Monthly account snapshots */
.account-snapshots-card{
  max-width:920px;
}
.snapshot-month{
  border-radius:13px;
  padding:11px 13px;
}
.snapshot-input-wrap{
  width:115px;
  min-height:36px;
  border-radius:9px;
}
.snapshot-input-wrap input{
  font-size:13px;
}

/* Backup / theme controls */
.bottom-tools{
  left:16px;
  right:16px;
  bottom:18px;
}
.theme-btn{
  min-height:40px;
  padding:9px 11px;
  font-size:12px;
  font-weight:550;
}
.theme-btn:hover{
  background:var(--soft);
}

/* Mobile app */
@media(max-width:700px){
  aside{display:none}
  main{
    margin:0;
    width:100%;
    max-width:none;
    padding:17px 14px calc(96px + env(safe-area-inset-bottom));
  }
  .mobile-head{
    margin-bottom:18px;
  }
  .mobile-head .brand{
    padding:0;
    font-size:18px;
  }
  .mobile-head .brand svg{
    width:19px;
    height:19px;
  }
  .topbar{
    margin-bottom:18px;
  }
  .topbar h1{
    font-size:24px;
  }
  .cards{
    gap:9px;
  }
  .card{
    padding:15px;
    border-radius:16px;
  }
  .stat-label{font-size:11px}
  .stat-value{font-size:19px}
  .section-grid{
    gap:12px;
    margin-top:12px;
  }
  .section-title{font-size:14px}
  .account{padding:10px}
  .account-icon{
    width:34px;
    height:34px;
    border-radius:10px;
  }
  .recent-overview-grid{
    gap:0;
  }
  .category-overview{
    margin-top:8px;
    padding-top:15px;
  }

  /* Recent transactions: compact, no horizontal overflow */
  #dashboard .recent-overview-grid .table{
    table-layout:fixed;
    min-width:0;
    width:100%;
  }
  #dashboard .recent-overview-grid .table th,
  #dashboard .recent-overview-grid .table td{
    padding:9px 3px;
    font-size:10.5px;
  }
  #dashboard .recent-overview-grid .table th:nth-child(1),

  #dashboard .recent-overview-grid .table th:nth-child(2),
  #dashboard .recent-overview-grid .table td:nth-child(2){width:27%}
  #dashboard .recent-overview-grid .table th:nth-child(3),
  #dashboard .recent-overview-grid .table td:nth-child(3){width:21%;white-space:nowrap}
  #dashboard .recent-overview-grid .table th:nth-child(4),
  #dashboard .recent-overview-grid .table td:nth-child(4){width:19%;white-space:nowrap;text-align:right}
  #dashboard .recent-overview-grid .table td:first-child{

  }
  #dashboard .recent-overview-grid .badge{

  }

  .bottom-nav{

    backdrop-filter:blur(18px);
    -webkit-backdrop-filter:blur(18px);
    border-top-color:var(--border);
  }
  .bottom-nav button{
    min-height:44px;
    border-radius:10px;
    font-weight:500;
  }
  .bottom-nav button.active{
    background:var(--soft);
    font-weight:650;
  }
  .bottom-nav button svg{
    width:19px;
    height:19px;
  }
}

/* Very small iPhones */
@media(max-width:390px){
  main{
    padding-left:12px;
    padding-right:12px;
  }
  .card{padding:14px}
  .stat-value{font-size:18px}
  #dashboard .recent-overview-grid .table th,
  #dashboard .recent-overview-grid .table td{
    padding-left:2px;
    padding-right:2px;
    font-size:10px;
  }
}

/* Reduce accidental horizontal page overflow */
html,body,#root,.app{
  max-width:100%;
  overflow-x:hidden;
}

/* Dashboard kleurcorrectie: bovenste 4 tegels neutraal, DealPlugNL neutraal */

   Budget Planner — Native App UI
   Visual layer only. Existing JS/data logic remains intact.

  --app-blue-soft:#eff6ff;
  --app-green:#059669;

  --app-card:#101827;
  --app-card-2:#141e2f;
  --app-text:#f7f9fc;

  --app-blue-2:#93c5fd;
  --app-blue-soft:#172554;
  --app-shadow:0 8px 30px rgba(0,0,0,.20);
  --app-shadow-lg:0 18px 50px rgba(0,0,0,.28);
}

html{
  background:var(--app-bg);
  scroll-behavior:smooth;
}
body{
  background:
    radial-gradient(circle at 90% -10%, color-mix(in srgb,var(--app-blue) 7%,transparent), transparent 32rem),
    var(--app-bg);
  color:var(--app-text);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text",Inter,system-ui,sans-serif;
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
}
.app{min-height:100dvh}

/* Desktop app shell */
aside{
  width:236px;
  padding:22px 13px;
  background:color-mix(in srgb,var(--app-card) 96%,transparent);
  border-right:1px solid var(--app-border);
  box-shadow:10px 0 35px rgba(15,23,42,.025);
  backdrop-filter:blur(18px);
  -webkit-backdrop-filter:blur(18px);

  border-radius:12px;
  color:var(--app-muted);

  transition:background .16s ease,color .16s ease,transform .16s ease;
}

  background:var(--app-card);

  min-height:38px;
  font-size:11px;
}

main{
  margin-left:236px;
  width:calc(100% - 236px);

.card:hover{

  border-color:color-mix(in srgb,var(--app-blue) 12%,var(--app-border));
}
.cards{gap:13px}
.section-grid{gap:13px;margin-top:13px}
.transactions{margin-top:13px}
.section-title{
  font-size:14px;
  font-weight:700;
  letter-spacing:-.02em;
  margin-bottom:13px;
}
.stat-label{
  color:var(--app-muted);
  font-size:11px;
  font-weight:600;
}

.stat-value{
  color:var(--app-text);
  font-size:23px;

}
.positive{color:var(--app-green)!important}

/* Buttons */
.btn,.icon-btn,.theme-btn{
  border:1px solid var(--app-border);
  background:var(--app-card);
  color:var(--app-text);
  border-radius:11px;
  transition:transform .15s ease,box-shadow .15s ease,background .15s ease,border-color .15s ease;
}
.btn:hover,.icon-btn:hover,.theme-btn:hover{
  background:var(--app-card-2);
  border-color:color-mix(in srgb,var(--app-blue) 25%,var(--app-border));
}
.btn.primary{
  background:var(--app-blue);
  border-color:var(--app-blue);
  color:#fff;
  box-shadow:0 6px 16px color-mix(in srgb,var(--app-blue) 18%,transparent);
}
.btn.primary:hover{background:var(--app-blue-2);border-color:var(--app-blue-2);transform:translateY(-1px)}

/* Forms */
.field label{
  font-size:10px;
  font-weight:650;
  color:var(--app-muted);
  margin-bottom:6px;
}
.field input,.field select{
  min-height:42px;
  padding:10px 12px;
  border:1px solid var(--app-border);
  border-radius:11px;

  color:var(--app-text);
  box-shadow:none;
}
.field input:focus,.field select:focus{
  border-color:var(--app-blue);
  box-shadow:0 0 0 3px color-mix(in srgb,var(--app-blue) 11%,transparent);
}

/* Lists / tables */
.account{
  border-color:var(--app-border);
  border-radius:13px;
  background:var(--app-card-2);
}
.account-icon{

}
.table th,.table td{border-bottom-color:var(--app-border)}
.table th{color:var(--app-muted)}
.badge{
  background:var(--app-blue-soft);
  color:var(--app-blue);
  border:0;
}

/* Toggle tabs */
.toggle{
  padding:3px;
  gap:3px;
  border:1px solid var(--app-border);
  border-radius:13px;
  background:var(--app-card-2);
}
.toggle button{
  border:0;
  border-radius:10px;

}
.toggle button.active{
  background:var(--app-card);
  color:var(--app-blue);
  border:0;
  box-shadow:0 2px 8px rgba(15,23,42,.07);
}

/* Quick actions */
.quick-grid{gap:9px}
.quick-btn{
  border:1px solid var(--app-border);
  border-radius:14px;
  background:var(--app-card);
  color:var(--app-text);
}
.quick-btn:hover{
  background:var(--app-blue-soft);
  border-color:color-mix(in srgb,var(--app-blue) 30%,var(--app-border));
  box-shadow:0 8px 22px rgba(15,23,42,.06);
}

/* Mobile header */
.mobile-head{
  position:sticky;
  top:0;
  z-index:18;
  margin:0 -14px 17px;
  padding:10px 14px 11px;
  background:color-mix(in srgb,var(--app-bg) 86%,transparent);
  border-bottom:1px solid color-mix(in srgb,var(--app-border) 72%,transparent);
  backdrop-filter:blur(18px);
  -webkit-backdrop-filter:blur(18px);
}
.mobile-head .brand{
  font-size:17px;

}

/* Native-looking bottom dock */
.bottom-nav{
  border:1px solid var(--app-border)!important;
  border-bottom:0!important;
  background:color-mix(in srgb,var(--app-card) 91%,transparent)!important;

  -webkit-backdrop-filter:blur(22px);
  padding:7px 7px calc(7px + env(safe-area-inset-bottom))!important;
}
.bottom-nav button{
  border-radius:12px!important;
  color:var(--app-muted);
  transition:background .15s ease,color .15s ease;
}
.bottom-nav button.active{
  background:var(--app-blue-soft)!important;

}
.bottom-nav button svg{width:18px!important;height:18px!important}

/* Investment tiles */
#dashboard .dashboard-crypto-pokemon-card,
#dashboard .dealplug-dashboard-card{

}
#dashboard .dashboard-crypto-pokemon-card{
  background:
    linear-gradient(135deg,color-mix(in srgb,var(--app-blue) 5%,var(--app-card)),var(--app-card))!important;
}

/* Keep dashboard dense like a finance app */
#dashboard > .cards{margin-bottom:0}
#dashboard > .section-grid{margin-top:13px}
#dashboard .dashboard-stat-card{border-radius:16px}

}

/* Small interaction polish */
button:active{transform:scale(.985)}
input,select{accent-color:var(--app-blue)}
::selection{background:color-mix(in srgb,var(--app-blue) 20%,transparent)}

/* Mobile */
@media(max-width:700px){
  body{
    background:var(--app-bg);

<script>
"use strict";

const STORAGE_KEY="budgetPlannerV2";
const DEFAULT_ACCOUNTS=[
{id:"acc1",name:"ABN Betaalrekening",type:"betaal",balance:0,icon:"wallet"},
{id:"acc2",name:"ABN Amro",type:"spaar",balance:0,icon:"piggy-bank"},
{id:"acc3",name:"Revolut Betaalrekening",type:"revolut-betaal",balance:0,icon:"credit-card"},
{id:"acc4",name:"Revolut",type:"revolut-spaar",balance:0,icon:"landmark"}
];
const categories=["Wonen","Boodschappen","Auto","Benzine","Vervoer","Abonnementen","Uit eten","Entertainment","Kleding","Vakantie","Gezondheid","Sport","Verzekeringen","Belastingen","Salaris","Freelance","Sparen","Overig"];
const quickExpenses=[["Boodschappen","shopping-cart"],["Tanken","fuel"],["Uit eten","utensils"],["Abonnement","credit-card"],["Kleding","shirt"],["Vervoer","car"],["Entertainment","gamepad-2"],["Vakantie","plane"],["Gezondheid","heart-pulse"],["Overig","more-horizontal"],["Crypto","bitcoin"]];

function freshData(){
return {theme:"light",cryptoEnabled:true,crypto:0,cryptoEntries:[],pokemonInitialInvestment:0,pokemonCards:[],accounts:structuredClone(DEFAULT_ACCOUNTS),transactions:[],budgets:[],goals:[],recurring:[],weeklySalary:{enabled:false,amount:0,accountId:"",description:"Wekelijks loon"},dealplug:{opening:0,entries:[]},processedRecurring:{},accountSnapshots:{}};
}
function loadData(){
let raw=null;
try{raw=JSON.parse(localStorage.getItem(STORAGE_KEY)||"null")}catch(e){}
if(!raw){
  try{
    const old=JSON.parse(localStorage.getItem("budgetPlannerV1")||"null");
    if(old) raw=old;
  }catch(e){}
}
const d=raw||freshData();
d.theme=d.theme==="dark"?"dark":"light";
d.cryptoEnabled=typeof d.cryptoEnabled==="boolean"?d.cryptoEnabled:true;
d.crypto=Number(d.crypto)||0;
d.accounts=Array.isArray(d.accounts)&&d.accounts.length?d.accounts:structuredClone(DEFAULT_ACCOUNTS);
const rename={"Betaalrekening":"ABN Betaalrekening","Spaarrekening":"ABN Amro","ABN Spaarrekening":"ABN Amro","Revolut Spaarrekening":"Revolut"};
d.accounts.forEach(a=>{if(rename[a.name])a.name=rename[a.name];a.balance=Number(a.balance)||0});
const savings=d.accounts.filter(a=>a.type==="spaar"||a.type==="revolut-spaar"||/spaarrekening/i.test(a.name));
d.accounts=savings.length?savings:[structuredClone(DEFAULT_ACCOUNTS[1])];
d.transactions=Array.isArray(d.transactions)?d.transactions:[];
d.budgets=Array.isArray(d.budgets)?d.budgets:[];
d.goals=Array.isArray(d.goals)?d.goals:[];
d.recurring=Array.isArray(d.recurring)?d.recurring:[];
d.cryptoEntries=Array.isArray(d.cryptoEntries)?d.cryptoEntries:[];
  d.cryptoEntries.forEach(e=>{if(!e.assetType)e.assetType="crypto"});
  d.pokemonInitialInvestment=Number(d.pokemonInitialInvestment)||0;
  d.pokemonCurrentValue=Number(d.pokemonCurrentValue)||0;
  d.pokemonCards=Array.isArray(d.pokemonCards)?d.pokemonCards:[];
  d.pokemonCards=d.pokemonCards.map(c=>({
    id:c.id||uid(),
    name:String(c.name||""),
    set:String(c.set||""),
    cardNumber:String(c.cardNumber||""),
    condition:c.condition==="psa"?"psa":"raw",
    psaGrade:String(c.psaGrade||""),
    psaCert:String(c.psaCert||""),
    language:c.language==="japanese"?"japanese":"english",
    purchasePrice:Number(c.purchasePrice)||0,
    purchaseDate:String(c.purchaseDate||today()),
    status:c.status==="sold"?"sold":"held",
    salePrice:Number(c.salePrice)||0,
    saleDate:String(c.saleDate||"")
  }));
d.dealplug=d.dealplug&&typeof d.dealplug==="object"?d.dealplug:{opening:0,entries:[]};
d.dealplug.opening=Number(d.dealplug.opening)||0;
d.dealplug.entries=Array.isArray(d.dealplug.entries)?d.dealplug.entries:[];
d.weeklySalary=d.weeklySalary&&typeof d.weeklySalary==="object"?d.weeklySalary:{enabled:false,amount:0,accountId:d.accounts[0]?.id||"",description:"Wekelijks loon"};
d.weeklySalary.enabled=!!d.weeklySalary.enabled;
d.weeklySalary.amount=Number(d.weeklySalary.amount)||0;
d.weeklySalary.accountId=(d.accounts.some(a=>a.id===d.weeklySalary.accountId)?d.weeklySalary.accountId:d.accounts[0]?.id)||"";
d.processedRecurring=d.processedRecurring&&typeof d.processedRecurring==="object"?d.processedRecurring:{};
d.accountSnapshots=d.accountSnapshots&&typeof d.accountSnapshots==="object"?d.accountSnapshots:{};
return d;
}
let data=loadData();
let activeView="dashboard";
let activeAssetTab="crypto";
let amountsVisible=true;
let currentMonth=new Date();
currentMonth.setDate(1);

const $=id=>document.getElementById(id);
const euro=n=>new Intl.NumberFormat("nl-NL",{style:"currency",currency:"EUR"}).format(Number(n)||0);
const protectedEuro=n=>amountsVisible?euro(n):"••••••";
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,9);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]));
const dateKey=d=>{const x=new Date(d);return `${x.getFullYear()}-${String(x.getMonth()+1).padStart(2,"0")}-${String(x.getDate()).padStart(2,"0")}`};
const monthKey=d=>{const x=new Date(d);return `${x.getFullYear()}-${String(x.getMonth()+1).padStart(2,"0")}`};
const monthName=()=>currentMonth.toLocaleDateString("nl-NL",{month:"long",year:"numeric"});
const today=()=>{const x=new Date();return `${x.getFullYear()}-${String(x.getMonth()+1).padStart(2,"0")}-${String(x.getDate()).padStart(2,"0")}`};
const accountById=id=>data.accounts.find(a=>a.id===id);
const monthTransactions=()=>data.transactions.filter(t=>monthKey(t.date)===monthKey(currentMonth));

function persist(){
localStorage.setItem(STORAGE_KEY,JSON.stringify(data));
}
function saveAndRender(){persist();render();}
function notify(msg){alert(msg);}

function setActiveView(view){
activeView=view;
document.querySelectorAll(".view").forEach(v=>v.classList.toggle("active",v.id===view));
document.querySelectorAll("[data-view]").forEach(b=>b.classList.toggle("active",b.dataset.view===view));
}
function navEvents(){
document.querySelectorAll("[data-view]").forEach(b=>b.addEventListener("click",()=>setActiveView(b.dataset.view)));
}
function themeToggle(){data.theme=data.theme==="dark"?"light":"dark";saveAndRender();}
function setupGlobalControls(){
$("themeBtn").onclick=themeToggle;
$("mobileTheme").onclick=themeToggle;
}

function processRecurringTransactions(){
const now=new Date();
const realMonth=monthKey(now);
const day=now.getDate();
const lastDay=new Date(now.getFullYear(),now.getMonth()+1,0).getDate();
let changed=false;
data.recurring.forEach(r=>{
const marker=realMonth+"_"+r.id;
if(data.processedRecurring[marker])return;
const scheduledDay=Math.min(31,Math.max(1,Number(r.day||1)));
const effectiveDay=Math.min(scheduledDay,lastDay);
if(day<effectiveDay)return;
const acc=accountById(r.accountId);
if(!acc)return;
const amount=Number(r.amount)||0;
if(amount<=0)return;
if(r.kind==="expense"&&acc.balance<amount)return;
const txDate=new Date(now.getFullYear(),now.getMonth(),effectiveDay);
const tx={id:uid(),description:r.description,amount,date:dateKey(txDate),category:r.category,accountId:r.accountId,kind:r.kind,recurringId:r.id};
data.transactions.push(tx);
acc.balance += r.kind==="income"?amount:-amount;
data.processedRecurring[marker]=true;
changed=true;
});
if(changed)persist();
}

function render(){
document.documentElement.dataset.theme=data.theme;
$("crypto").style.display="";
renderDashboard();renderTransactions();renderAccounts();renderCrypto();renderDealPlug();renderGoals();renderRecurring();
setActiveView(activeView);
lucide.createIcons();
}

function valForDashboard(type,snapshot){
  if(type==="private") return revolutPrivateBalance(snapshot);
  return 0;
}

function monthlyAccountEffect(month,ids){
  const ts=Array.isArray(data.transactions)?data.transactions:[];
  return ts.filter(t=>monthKey(t.date)===month).reduce((sum,t)=>{
    const amount=Number(t.amount||0);
    if(t.kind==="income" && ids.includes(t.accountId)) return sum+amount;
    if(t.kind==="expense" && ids.includes(t.accountId)) return sum-amount;
    if(t.kind==="transfer"){
      if(ids.includes(t.accountId)) sum-=amount;
      if(ids.includes(t.toAccountId)) sum+=amount;
    }
    return sum;
  },0);
}

function displayedAccountBalances(month){
  const key=month||monthKey(currentMonth);
  const snap=data.accountSnapshots?.[key]||{};

  // Actuele saldi zijn leidend voor het scherm. De maandstand blijft alleen
  // de historische referentie en wordt nooit aangepast door overboekingen.
  // ABN en Revolut privé hebben een echte account-balance; DealPlug/Crypto
  // worden vanuit hun maandstand + mutaties berekend.
  const abnAccount=accountById("acc2");
  const revolutAccount=accountById("acc4");
  const realCurrentMonth=monthKey(new Date());
  const isCurrentMonth=key===realCurrentMonth;

  // Voor de huidige maand gebruiken we de actuele rekeningstatus.
  // Voor historische maanden gebruiken we juist de opgeslagen maandstand.
  // Zo overschrijft een actuele rekeningstand nooit een eerder opgeslagen maandstand.
  const abn=isCurrentMonth && abnAccount
    ? Number(abnAccount.balance||0)
    : Number(snap.acc1||0);

  const privateRevolut=isCurrentMonth && revolutAccount
    ? Number(revolutAccount.balance||0)
    : Number(snap.acc4||0);

  const monthTransfers=(Array.isArray(data.transactions)?data.transactions:[])
    .filter(t=>t.kind==="revolutTransfer" && (t.month===key || monthKey(t.date)===key));

  const dealplugBase=Number(snap.revolutSubaccounts?.dealplug||0);
  const cryptoBase=Number(snap.revolutSubaccounts?.crypto||0);

  const dealplugTransfers=monthTransfers.reduce((sum,t)=>{
    const n=Number(t.amount||0);
    if(t.fromTarget==="dealplug") return sum-n;
    if(t.toTarget==="dealplug") return sum+n;
    return sum;
  },0);
  const cryptoTransfers=monthTransfers.reduce((sum,t)=>{
    const n=Number(t.amount||0);
    if(t.fromTarget==="crypto") return sum-n;
    if(t.toTarget==="crypto") return sum+n;
    return sum;
  },0);

  const dealplug=dealplugBase+dealplugTransfers+dealplugNetForMonth(key);
  const crypto=cryptoBase+cryptoTransfers;
  // Crypto / Aandelen is een aparte subrekening binnen het totale Revolut-
  // vermogen. Het bedrag wordt dus wel meegenomen in het Revolut-totaal,
  // maar blijft afzonderlijk zichtbaar en wordt niet vermengd met de andere
  // subrekeningen.
  const revolut=privateRevolut+dealplug+crypto;

  return {abn,privateRevolut,dealplug,crypto,revolut,total:abn+revolut};
}

function dashboardTransactionTime(t){
  // Nieuwe transacties krijgen een uid die begint met Date.now() in base36.
  // Alleen de eerste 8 tekens horen bij de timestamp; de rest is willekeurige
  // tekst. Door niet de volledige id te parsen voorkomen we een ongeldige datum.
  const rawId=String(t?.id||"").replace(/^dp_/,'');
  const timestamp=parseInt(rawId.slice(0,8),36);
  if(Number.isFinite(timestamp) && timestamp>100000000000) return timestamp;

  // Ook oudere transacties kunnen een expliciete aanmaaktijd bevatten.
  const explicitTime=t?.createdAt||t?.timestamp||t?.created_at;
  if(explicitTime!==undefined && explicitTime!==null){
    const explicitParsed=typeof explicitTime==="number"
      ? explicitTime
      : new Date(explicitTime).getTime();
    if(Number.isFinite(explicitParsed) && explicitParsed>0) return explicitParsed;
  }

  const parsedDate=new Date(t?.date).getTime();
  return Number.isFinite(parsedDate)?parsedDate:0;
}

function dashboardTransactionDateText(t){
  const raw=t?.date;
  const parsed=new Date(raw);
  if(!Number.isNaN(parsed.getTime())){
    return parsed.toLocaleDateString("nl-NL",{day:"2-digit",month:"2-digit",year:"numeric"});
  }
  return "Datum onbekend";
}

function renderDashboard(){
const ts=monthTransactions();

const expenseTransactions=ts.filter(t=>t.kind==="expense").reduce((s,t)=>s+Number(t.amount),0);
const dealplugMonthEntries=Array.isArray(data.dealplug?.entries)
  ? data.dealplug.entries.filter(e=>monthKey(e.date)===monthKey(currentMonth))
  : [];
const dealplugMonthIncome=dealplugMonthEntries.filter(e=>e.kind==="income").reduce((s,e)=>s+Number(e.amount||0),0);
const dealplugMonthCosts=dealplugMonthEntries.reduce((s,e)=>{
  if(e.dealplugSale) return s+Number(e.cost||0);
  if(e.kind==="expense"||e.kind==="cost"||e.kind==="kosten") return s+Number(e.amount||0);
  return s;
},0);
// DealPlugNL-verkopen en inkopen/kosten tellen mee in de maandtotalen op het dashboard.

const expenses=expenseTransactions+dealplugMonthCosts;

// De handmatige rekeningstand zelf blijft ongewijzigd door transacties.
const cash=accountStand+(incomeTransactions-expenseTransactions);
const net=income-expenses;
// Laat gewone transacties ook direct terugkomen in de weergegeven rekeningstand.
// Het maandelijkse snapshot blijft het uitgangspunt; de transacties van deze maand worden daarop toegepast.
const displayedBalances=displayedAccountBalances(dashboardSnapshotKey);
const dashboardAbnBalance=displayedBalances.abn;
const dashboardRevolutBalance=displayedBalances.revolut;
const dealplugEntries=Array.isArray(data.dealplug?.entries)?data.dealplug.entries:[];
const dpIncome=dealplugEntries.filter(e=>e.kind==="income").reduce((s,e)=>s+Number(e.amount||0),0);
const dpCosts=dealplugEntries.reduce((s,e)=>{
  if(e.dealplugSale) return s+Number(e.cost||0);
  if(e.kind==="expense"||e.kind==="cost"||e.kind==="kosten") return s+Number(e.amount||0);
  return s;
},0);
const dpBalance=Number(data.dealplug.opening)+dpIncome-dpCosts;
const dashboardCryptoEntries=Array.isArray(data.cryptoEntries)?data.cryptoEntries:[];
const dashboardCryptoInvested=dashboardCryptoEntries.filter(e=>(e.assetType||"crypto")==="crypto"&&e.type==="in").reduce((s,e)=>s+Number(e.amount||0),0);
const dashboardCryptoCashouts=dashboardCryptoEntries.filter(e=>(e.assetType||"crypto")==="crypto"&&e.type==="out").reduce((s,e)=>s+Number(e.amount||0),0);
const dashboardCryptoResult=dashboardCryptoCashouts-dashboardCryptoInvested;
const dashboardCryptoOpen=Math.max(0,dashboardCryptoInvested-dashboardCryptoCashouts);
const dashboardPokemonLegacyInvested=dashboardCryptoEntries.filter(e=>(e.assetType||"crypto")==="pokemon"&&e.type==="in").reduce((s,e)=>s+Number(e.amount||0),0);
const dashboardPokemonLegacyCashouts=dashboardCryptoEntries.filter(e=>(e.assetType||"crypto")==="pokemon"&&e.type==="out").reduce((s,e)=>s+Number(e.amount||0),0);
const dashboardPokemonCardPurchaseTotal=Array.isArray(data.pokemonCards)
  ? data.pokemonCards.reduce((s,c)=>s+Number(c.purchasePrice||0),0)

const dashboardPokemonCashouts=dashboardPokemonLegacyCashouts+  (Array.isArray(data.pokemonCards)?data.pokemonCards.filter(c=>c.status==="sold").reduce((s,c)=>s+Number(c.salePrice||0),0):0);
const dashboardPokemonResult=dashboardPokemonCashouts-dashboardPokemonInvested;

// Laatste transacties worden hieronder samengesteld uit zowel gewone rekeningtransacties

// Laatste transacties voor de rekeningtegel op het dashboard.

const allDashboardDealplugTransactions=(Array.isArray(data.dealplug?.entries)?data.dealplug.entries:[])

const recentDealplugTransactions=[...allDashboardDealplugTransactions]

const dashboardSnapshotLabel=new Date(Number(dashboardSnapshotKey.slice(0,4)),Number(dashboardSnapshotKey.slice(5,7))-1,1).toLocaleDateString("nl-NL",{month:"long",year:"numeric"});

function quickExpense(category,amount,description){
  // Snelle uitgaven worden net als gewone uitgaven van de
  // ABN Amro spaarrekening afgeboekt.
  const savingsAccount=accountById("acc2");
  if(!savingsAccount){notify("ABN Amro spaarrekening niet gevonden.");return}
  if(Number(savingsAccount.balance||0)<amount){
    notify(`Onvoldoende saldo op ${savingsAccount.name}. Beschikbaar: ${euro(savingsAccount.balance)}.`);
    return;
  }

  savingsAccount.balance-=amount;
  const tx={
    id:uid(),
    description:description||category,
    amount,
    date:today(),
    category,
    accountId:savingsAccount.id,
    kind:"expense",
    quickOnly:true
  };
  data.transactions.push(tx);
  saveAndRender();
}
function addWorkIncome(amount){
const acc=data.accounts[0];
if(!acc){notify("Geen spaarrekening gevonden.");return}
data.transactions.push({id:uid(),description:"Loon uit werk",amount,date:today(),category:"Salaris",accountId:acc.id,kind:"income"});
acc.balance+=amount;saveAndRender();
}
function addCryptoContribution(amount){
data.cryptoEntries.push({id:uid(),type:"in",amount,date:today(),description:"Crypto inleg"});
data.crypto=(Number(data.crypto)||0)+amount;saveAndRender();
}
function addDealPlugEntry(kind,amount,description){
data.dealplug.entries.push({id:uid(),kind,amount,date:today(),description});saveAndRender();
}

function transactionRow(t,full){
const acc=accountById(t.accountId);
const to=accountById(t.toAccountId);
const sign=t.kind==="income"?"+":t.kind==="transfer"||t.kind==="revolutTransfer"?"↔":t.kind==="revolutAdjustment"?(t.direction==="add"?"+":"-"):"-";
const cls=t.kind==="income"||t.kind==="revolutAdjustment"&&t.direction==="add"?"positive":t.kind==="expense"||t.kind==="revolutAdjustment"&&t.direction==="remove"?"negative":"";
const accountLabel=t.kind==="revolutAdjustment"?({private:"Revolut privé",dealplug:"DealPlugNL",crypto:"Crypto / Aandelen"}[t.target]||"Revolut"):t.kind==="revolutTransfer"?`${({private:"Revolut privé",dealplug:"DealPlugNL",crypto:"Crypto / Aandelen"}[t.fromTarget]||"Revolut")} → ${({private:"Revolut privé",dealplug:"DealPlugNL",crypto:"Crypto / Aandelen"}[t.toTarget]||"Revolut")}`:(t.quickOnly?"Uitgavenregistratie":(acc?.name||"-"));
const categoryLabel=t.kind==="revolutAdjustment"?"Revolut mutatie":t.category;
const txTime=dashboardTransactionTime(t);
const txDate=new Date(t.date).toLocaleDateString("nl-NL");
const txTimeText=Number.isFinite(txTime)&&txTime>0?new Date(txTime).toLocaleTimeString("nl-NL",{hour:"2-digit",minute:"2-digit"}):"";
return `<tr><td>${esc(t.description)}</td><td><span class="badge">${esc(categoryLabel)}</span></td><td><span class="transaction-date">${txDate}<small>${txTimeText}</small></span></td>${full?`<td>${esc(accountLabel)}${t.kind==="transfer"&&to?` → ${esc(to.name)}`:""}</td>`:""}<td class="${cls}">${sign}${euro(t.amount)}</td>${full?`<td><div class="actions"><button data-edit="${t.id}" title="Bewerken"><i data-lucide="pencil"></i></button><button data-delete="${t.id}" class="danger" title="Verwijderen"><i data-lucide="trash-2"></i></button></div></td>`:""}</tr>`;
}

$("transactionForm").onsubmit=e=>{
e.preventDefault();
const description=$("description").value.trim();
const amount=Number($("amount").value);
const date=$("date").value;
const accountId=$("account").value;
if(!description){notify("Vul een omschrijving in.");return}
if(!Number.isFinite(amount)||amount<=0){notify("Vul een geldig bedrag in.");return}
if(!date){notify("Kies een datum.");return}
if(kind==="transfer"){
const from=accountById(accountId),to=accountById($("transferTo").value);
if(!from||!to||from.id===to.id){notify("Kies twee verschillende rekeningen.");return}

// Gebruik voor de saldo-check dezelfde maandstanden als het dashboard.
// ABN Amro wordt in de maandstanden als acc1 opgeslagen, terwijl de
// transactiekeuze acc2 gebruikt. Revolut privé gebruikt acc4.
const month=monthKey(new Date(date));
const snap=data.accountSnapshots?.[month];
const transferEffect=(ids)=>data.transactions.filter(t=>monthKey(t.date)===month).reduce((sum,t)=>{
  const n=Number(t.amount||0);
  if(t.kind==="income" && ids.includes(t.accountId)) return sum+n;
  if(t.kind==="expense" && ids.includes(t.accountId)) return sum-n;
  if(t.kind==="transfer"){
    if(ids.includes(t.accountId)) sum-=n;
    if(ids.includes(t.toAccountId)) sum+=n;
  }
  return sum;
},0);
// Gebruik exact hetzelfde actuele saldo als de rekeningtegels op het
// dashboard/transacties. Daardoor worden eerdere overboekingen meteen
// meegenomen in de volgende saldo-check.
const balancesBeforeTransfer=displayedAccountBalances(month);
const sourceBalance=from.id==="acc2"
  ? Number(balancesBeforeTransfer.abn||0)
  : from.id==="acc4"
    ? Number(balancesBeforeTransfer.privateRevolut||0)
    : Number(from.balance||0);
if(sourceBalance+0.000001<amount){
  notify(`Overboeking geweigerd: onvoldoende saldo op ${from.name}. Beschikbaar: ${euro(sourceBalance)}.`);
  return;
}

from.balance-=amount;
to.balance+=amount;

// Een overboeking verandert NOOIT de opgeslagen maandstand.
// De maandstand is een vast historisch meetpunt; de actuele rekeningstanden
// worden hierboven bijgewerkt en de overboeking blijft als transactie geregistreerd.
data.transactions.push({id:uid(),description,amount,date,category:"Overboeking",accountId:from.id,toAccountId:to.id,kind:"transfer"});
}else{
const acc=accountById(accountId);
if(!acc){notify("Kies een rekening.");return}

// Een gewone inkomsten-/kostentransactie verandert ook het actuele saldo
// van de gekozen rekening. De opgeslagen maandstand blijft een historisch
// snapshot; alleen de actuele maandrekening wordt live bijgewerkt.
const transactionMonth=monthKey(new Date(date));
if(transactionMonth===monthKey(new Date())){
  if(kind==="expense") {
    if(Number(acc.balance||0)+0.000001<amount){
      notify(`Transactie geweigerd: onvoldoende saldo op ${acc.name}. Beschikbaar: ${euro(acc.balance||0)}.`);
      return;
    }
    acc.balance-=amount;
  } else if(kind==="income") {
    acc.balance+=amount;
  }
}

data.transactions.push({id:uid(),description,amount,date,category:$("category").value,accountId,kind});
}
saveAndRender();
};

function editTransaction(tid){
const t=data.transactions.find(x=>x.id===tid);if(!t)return;
const val=prompt("Nieuw bedrag (€):",String(t.amount));
if(val===null)return;
const n=Number(val);if(!Number.isFinite(n)||n<=0){notify("Ongeldig bedrag.");return}
if(t.kind==="revolutTransfer"){
  const privateAccount=accountById("acc4");
  // Eerst de oude beweging terugdraaien op het actuele saldo.
  if(privateAccount){
    if(t.fromTarget==="private") privateAccount.balance+=Number(t.amount||0);
    if(t.toTarget==="private") privateAccount.balance-=Number(t.amount||0);
  }
  // Controleer daarna het nieuwe bedrag vanuit de herstelde actuele bron.
  const displayed=displayedAccountBalances(t.month);
  const sourceBefore=t.fromTarget==="private"
    ? Number(privateAccount?.balance||0)
    : t.fromTarget==="dealplug" ? Number(displayed.dealplug||0) : Number(displayed.crypto||0);
  if(sourceBefore<n){notify("Onvoldoende saldo voor dit nieuwe bedrag.");return}
  if(privateAccount){
    if(t.fromTarget==="private") privateAccount.balance-=n;
    if(t.toTarget==="private") privateAccount.balance+=n;
  }
  t.amount=n;
  persist();render();
  return;
}
if(t.kind==="revolutAdjustment"){
  const snap=data.accountSnapshots?.[t.month];
  if(snap){
    snap.revolutSubaccounts=snap.revolutSubaccounts||{};
    const current=t.target==="private"?Number(snap.acc4||0):Number(snap.revolutSubaccounts[t.target]||0);
    const next=t.direction==="add"?current-t.amount:current+t.amount;
    if(t.target==="private")snap.acc4=Math.max(0,next);else snap.revolutSubaccounts[t.target]=Math.max(0,next);
  }
}else if(t.kind==="transfer"){const from=accountById(t.accountId),to=accountById(t.toAccountId);if(from)from.balance+=t.amount;if(to)to.balance-=t.amount
}else if(t.kind==="income"||t.kind==="expense"){
  const acc=accountById(t.accountId);
  if(acc && monthKey(new Date(t.date))===monthKey(new Date())){
    if(t.kind==="income") acc.balance-=Number(t.amount||0);
    else acc.balance+=Number(t.amount||0);
  }
}
data.transactions=data.transactions.filter(x=>x.id!==tid);saveAndRender();
}

function deleteTransaction(tid){
const t=data.transactions.find(x=>x.id===tid);if(!t)return;
if(!confirm("Deze transactie verwijderen?"))return;
if(t.kind==="revolutTransfer"){
  const privateAccount=accountById("acc4");
  if(privateAccount){
    if(t.fromTarget==="private") privateAccount.balance+=Number(t.amount||0);
    if(t.toTarget==="private") privateAccount.balance-=Number(t.amount||0);
  }
}else if(t.kind==="revolutAdjustment"){
  const snap=data.accountSnapshots?.[t.month];
  if(snap){
    snap.revolutSubaccounts=snap.revolutSubaccounts||{};
    const current=t.target==="private"?Number(snap.acc4||0):Number(snap.revolutSubaccounts[t.target]||0);
    const next=t.direction==="add"?current-t.amount:current+t.amount;
    if(t.target==="private")snap.acc4=Math.max(0,next);else snap.revolutSubaccounts[t.target]=Math.max(0,next);
  }
}else if(t.kind==="transfer"){
  const from=accountById(t.accountId),to=accountById(t.toAccountId);
  if(from)from.balance+=t.amount;
  if(to)to.balance-=t.amount;
}else if(t.kind==="income"||t.kind==="expense"){
  const acc=accountById(t.accountId);
  if(acc && monthKey(new Date(t.date))===monthKey(new Date())){
    if(t.kind==="income") acc.balance-=Number(t.amount||0);
    else acc.balance+=Number(t.amount||0);
  }
}
data.transactions=data.transactions.filter(x=>x.id!==tid);saveAndRender();
}

let selectedSnapshotMonth="";

function dealplugNetForMonth(month){
  const entries=Array.isArray(data.dealplug?.entries)?data.dealplug.entries:[];
  return entries.filter(e=>monthKey(e.date)===month).reduce((sum,e)=>{
    const amount=Number(e.amount||0);
    if(e.kind==="income") return sum+amount;
    if(e.kind==="expense"||e.kind==="cost"||e.kind==="kosten") return sum-amount;
    return sum;
  },0);
}
function dealplugBalanceForMonth(month,snapshot){
  return Number(snapshot?.revolutSubaccounts?.dealplug||0)+dealplugNetForMonth(month);
}
function revolutPrivateCurrentBalance(month){
  return Number(displayedAccountBalances(month).privateRevolut||0);
}

function revolutPrivateBalance(snapshot){
  // Gebruik de maandstand als die expliciet is opgeslagen. Als die nog niet
  // bestaat, gebruik dan het actuele Revolut-saldo uit de rekeninggegevens.
  if(snapshot && Object.prototype.hasOwnProperty.call(snapshot,"acc4")){
    return Number(snapshot.acc4||0);
  }
  const acc=accountById("acc4");
  return Number(acc?.balance||0);
}
function revolutSubTotal(snapshot,month){
  const subs=snapshot?.revolutSubaccounts||{};
  const dealplug=month?dealplugBalanceForMonth(month,snapshot):Number(subs.dealplug||0);
  const crypto=Number(subs.crypto||0);
  // Crypto / Aandelen blijft een aparte subrekening, maar telt wel mee in
  // het totale Revolut-saldo.
  return dealplug+crypto;
}
function revolutTotal(snapshot,month){
  return revolutPrivateBalance(snapshot)+revolutSubTotal(snapshot,month);
}

function renderCrypto(){
  const entries=[...data.cryptoEntries].sort((a,b)=>new Date(b.date)-new Date(a.date));
  const cryptoEntries=entries.filter(e=>(e.assetType||"crypto")==="crypto");
  const pokemonEntries=entries.filter(e=>(e.assetType||"crypto")==="pokemon");

  const cryptoInvested=cryptoEntries.filter(e=>e.type==="in").reduce((s,e)=>s+Number(e.amount),0);
  const cryptoCashouts=cryptoEntries.filter(e=>e.type==="out").reduce((s,e)=>s+Number(e.amount),0);
  const cryptoResult=cryptoCashouts-cryptoInvested;
  const cryptoOpen=Math.max(0,cryptoInvested-cryptoCashouts);

  const legacyPokemonInvested=pokemonEntries.filter(e=>e.type==="in").reduce((s,e)=>s+Number(e.amount),0);
  const legacyPokemonCashouts=pokemonEntries.filter(e=>e.type==="out").reduce((s,e)=>s+Number(e.amount),0);
  const legacyPokemonResult=legacyPokemonCashouts-legacyPokemonInvested;
  const legacyPokemonOpen=Math.max(0,legacyPokemonInvested-legacyPokemonCashouts);

  const pokemonCards=Array.isArray(data.pokemonCards)?data.pokemonCards:[];
  const pokemonHeldCards=pokemonCards.filter(c=>c.status!=="sold");
  const pokemonSoldCards=pokemonCards.filter(c=>c.status==="sold");
  const pokemonCardPurchaseTotal=pokemonCards.reduce((sum,c)=>sum+Number(c.purchasePrice||0),0);
  const pokemonHeldCost=pokemonHeldCards.reduce((sum,c)=>sum+Number(c.purchasePrice||0),0);
  const pokemonSoldCost=pokemonSoldCards.reduce((sum,c)=>sum+Number(c.purchasePrice||0),0);
  const pokemonSalesTotal=pokemonSoldCards.reduce((sum,c)=>sum+Number(c.salePrice||0),0);
  const pokemonCardRealized=pokemonSalesTotal-pokemonSoldCost;

  // De historische inleg is een eenmalig startpunt. Nieuwe kaartregistraties
  // worden daar bovenop gevolgd; zo hoeft de gebruiker oude aankopen niet terug
  // te reconstrueren. De actuele marktwaarde van de collectie kan handmatig
  // worden bijgehouden, zodat ongerealiseerde winst/verlies zichtbaar wordt.
  const pokemonInitial=Number(data.pokemonInitialInvestment||0);
  const pokemonOpen=pokemonInitial+legacyPokemonOpen+pokemonHeldCost;

return `<tr><td>${esc(e.description)}</td><td>${new Date(e.date).toLocaleDateString("nl-NL")}</td><td>${typeLabel}</td><td class="${e.kind==="income"?"positive":"negative"}">${e.kind==="income"?"+":"-"}${amountLabel}${isSale&&Number(e.cost||0)>0?` <span class="small">(kosten ${euro(e.cost)})</span>`:""}</td><td><button class="icon-btn danger" data-dp-delete="${e.id}"><i data-lucide="trash-2"></i></button></td></tr>`;
}).join("")}</tbody></table></div>`:`<div class="empty">Nog geen DealPlugNL-verkopen of kosten.</div>`}</div>`;
$("saveDpOpening").onclick=()=>{const n=Number($("dpOpening").value);if(!Number.isFinite(n)){notify("Ongeldige beginstand.");return}data.dealplug.opening=n;saveAndRender()};
let kind="sale";
const setDpMode=(mode)=>{
  kind=mode;
  document.querySelectorAll("#dpForm [data-dpkind]").forEach(x=>x.classList.toggle("active",x.dataset.dpkind===mode));
  const sale=mode==="sale";
  $("dpSaleFields").style.display=sale?"block":"none";
  $("dpSimpleFields").style.display=sale?"none":"block";
  $("dpSaleDesc").required=sale;
  $("dpSaleAmount").required=sale;
  $("dpDesc").required=!sale;
  $("dpAmount").required=!sale;
  $("dpSubmitLabel").textContent=sale?"Verkoop toevoegen":mode==="income"?"Inkomst toevoegen":"Kosten toevoegen";
};
document.querySelectorAll("#dpForm [data-dpkind]").forEach(b=>b.onclick=()=>setDpMode(b.dataset.dpkind));
$("dpForm").onsubmit=e=>{
  e.preventDefault();
  if(kind==="sale"){
    const amount=Number($("dpSaleAmount").value);
    const cost=Math.max(0,Number($("dpSaleCost").value||0));
    const description=$("dpSaleDesc").value.trim();
    const date=$("dpSaleDate").value;
    const costAccountId=$("dpCostAccount").value;
    const costAccount=accountById(costAccountId);
    if(!description){notify("Vul een omschrijving in.");return}
    if(!Number.isFinite(amount)||amount<=0){notify("Vul een geldige verkoopprijs in.");return}
    if(!Number.isFinite(cost)||cost<0){notify("Vul geldige inkoopkosten in.");return}
    if(!date){notify("Kies een datum.");return}
    if(cost>0&&!costAccount){notify("Kostenrekening niet gevonden.");return}
    const saleId=uid();
    const costTxId=uid();
    data.dealplug.entries.push({id:saleId,kind:"income",amount,date,description,dealplugSale:true,cost,linkedCostTransactionId:costTxId});
    if(cost>0){
      costAccount.balance-=cost;
      data.transactions.push({id:costTxId,description:`Inkoopkosten — ${description}`,amount:cost,date,category:"DealPlugNL kosten",accountId:costAccountId,kind:"expense",dealplugLinked:true,dealplugSaleId:saleId});
    }
    saveAndRender();
    notify(`${euro(amount)} verkoop toegevoegd. ${euro(cost)} kosten via ${costAccount?.name||"rekening"}. Nettowinst: ${euro(amount-cost)}.`);
    return;
  }
  const amount=Number($("dpAmount").value);
  const description=$("dpDesc").value.trim();
  const date=$("dpDate").value;
  if(!description){notify("Vul een omschrijving in.");return}
  if(!Number.isFinite(amount)||amount<=0){notify("Vul een geldig bedrag in.");return}
  if(!date){notify("Kies een datum.");return}
  data.dealplug.entries.push({id:uid(),kind,amount,date,description});
  saveAndRender();
};
document.querySelectorAll("[data-dp-delete]").forEach(b=>b.onclick=()=>{
  if(!confirm("Deze DealPlugNL-post verwijderen?")) return;
  const entry=data.dealplug.entries.find(e=>e.id===b.dataset.dpDelete);
  if(entry?.dealplugSale){
    const linkedId=entry.linkedCostTransactionId;
    const tx=data.transactions.find(t=>t.id===linkedId);
    if(tx?.accountId){const acc=accountById(tx.accountId);if(acc) acc.balance+=Number(tx.amount||0);}
    data.transactions=data.transactions.filter(t=>t.id!==linkedId);
  }
  data.dealplug.entries=data.dealplug.entries.filter(e=>e.id!==b.dataset.dpDelete);
  saveAndRender();
});
setDpMode("sale");
}

  $("goals").innerHTML=`<div class="topbar"><div><h1>Spaardoelen</h1><div class="subtitle">Bouw gericht aan je financiële doelen</div></div></div>
  <div class="card"><div class="section-title">Spaardoel toevoegen</div><form id="goalForm"><div class="goal-form-grid"><div class="field"><label>Naam</label><input id="goalName" required placeholder="Bijv. Miami trip"></div><div class="field"><label>Doelbedrag (€)</label><input id="goalTarget" type="number" min="0.01" step=".01" required inputmode="decimal"></div><div class="field"><label>Huidig bedrag (€)</label><input id="goalCurrent" type="number" min="0" step=".01" value="0" inputmode="decimal"></div></div><div class="form-actions"><button class="btn primary"><i data-lucide="plus"></i>Doel opslaan</button></div></form></div>

  $("goalForm").onsubmit=e=>{e.preventDefault();const name=$("goalName").value.trim(),target=Number($("goalTarget").value),current=Number($("goalCurrent").value)||0;if(!name||!Number.isFinite(target)||target<=0||current<0){notify("Vul een geldige naam en bedragen in.");return}data.goals.push({id:uid(),name,target,current});saveAndRender()};
  document.querySelectorAll("[data-goal-add]").forEach(b=>b.onclick=()=>{const i=Number(b.dataset.goalAdd);const n=Number(String(prompt("Hoeveel wil je toevoegen? (€)")||"").replace(",","."));if(!Number.isFinite(n)||n<=0)return;data.goals[i].current=Number(data.goals[i].current||0)+n;saveAndRender()});
  document.querySelectorAll("[data-goal-delete]").forEach(b=>b.onclick=()=>{if(confirm("Spaardoel verwijderen?")){data.goals.splice(Number(b.dataset.goalDelete),1);saveAndRender()}});
}

function renderRecurring(){
$("recurring").innerHTML=`<div class="topbar"><div><h1>Terugkerend</h1><div class="subtitle">Vaste inkomsten en kosten automatisch verwerken</div></div></div>
<div class="card"><div class="section-title">Wekelijks loon</div><div class="small" style="margin-bottom:14px">Automatisch iedere woensdag als inkomen toevoegen. Als je de app later in de week opent, wordt het loon van die woensdag alsnog geregistreerd.</div>
<div class="form-grid"><div class="field"><label>Bedrag (€)</label><input id="weeklySalaryAmount" type="number" min="0.01" step=".01" inputmode="decimal" placeholder="Bijv. 550" value="${data.weeklySalary?.amount||""}"></div><div class="field"><label>Op rekening</label><select id="weeklySalaryAccount">${data.accounts.map(a=>`<option value="${a.id}" ${a.id===(data.weeklySalary?.accountId||data.accounts[0]?.id)?"selected":""}>${esc(a.name)}</option>`).join("")}</select></div></div>
<div class="form-actions"><label class="toggle" style="display:flex;align-items:center;gap:10px"><input id="weeklySalaryEnabled" type="checkbox" ${data.weeklySalary?.enabled?"checked":""}> Inschakelen</label><button type="button" class="btn primary" id="saveWeeklySalary">Wekelijks loon opslaan</button></div></div>
<div class="notice"><i data-lucide="info"></i> Op de gekozen dag wordt de transactie automatisch één keer per maand toegevoegd. Een uitgave wordt alleen verwerkt als er voldoende saldo is.</div>
<div class="card"><div class="section-title">Terugkerende transactie toevoegen</div><form id="recForm"><div class="toggle"><button type="button" data-reckind="expense" class="active">Uitgave</button><button type="button" data-reckind="income">Inkomst</button></div>
<div class="form-grid"><div class="field"><label>Omschrijving</label><input id="recDesc" required placeholder="Bijv. Huur"></div><div class="field"><label>Bedrag (€)</label><input id="recAmount" type="number" min="0.01" step=".01" required inputmode="decimal"></div><div class="field"><label>Categorie</label><select id="recCat">${categories.map(c=>`<option>${c}</option>`).join("")}</select></div><div class="field"><label>Rekening</label><select id="recAcc">${data.accounts.map(a=>`<option value="${a.id}">${esc(a.name)}</option>`).join("")}</select></div><div class="field"><label>Dag van de maand</label><input id="recDay" type="number" min="1" max="31" step="1" value="1" required inputmode="numeric"><div class="small">Bijv. 1 voor huur, 5 voor verzekering.</div></div></div>
<div class="form-actions"><button class="btn primary"><i data-lucide="repeat"></i>Toevoegen</button></div></form></div>
<div class="card transactions recurring-list-card"><div class="section-title">Vaste transacties</div>${data.recurring.length?data.recurring.map((r,i)=>`<div class="account recurring-item"><div class="account-left"><div class="account-icon"><i data-lucide="repeat"></i></div><div class="recurring-info"><strong>${esc(r.description)}</strong><div class="small">Elke maand op dag ${Number(r.day||1)} · ${esc(r.category)} · ${esc(accountById(r.accountId)?.name||"-")}</div></div></div><div class="recurring-actions"><span class="${r.kind==="income"?"positive":"negative"}">${r.kind==="income"?"+":"-"}${euro(r.amount)}</span><button class="icon-btn recurring-edit-btn" data-rec-edit-day="${i}" title="Dag aanpassen" aria-label="Dag aanpassen"><i data-lucide="pencil"></i></button><button class="icon-btn danger" data-rec-delete="${i}" title="Verwijderen" aria-label="Verwijderen"><i data-lucide="trash-2"></i></button></div></div>`).join(""):`<div class="empty">Nog geen terugkerende transacties.</div>`}</div>
${(()=>{
  const deductions=(Array.isArray(data.transactions)?data.transactions:[])
    .filter(t=>t.recurringId && t.kind==="expense")
    .sort((a,b)=>String(b.date).localeCompare(String(a.date)));
  return `<div class="card transactions recurring-deductions-compact"><div class="section-title">Afschrijvingen</div><div class="small" style="margin-bottom:12px">Hier zie je alleen vaste kosten die daadwerkelijk zijn verwerkt, op de vaste dag die je hebt ingesteld.</div>${deductions.length?`<div style="overflow-x:auto"><table style="width:100%;border-collapse:collapse"><thead><tr><th style="text-align:left;padding:8px 6px">Datum</th><th style="text-align:left;padding:8px 6px">Omschrijving</th><th style="text-align:left;padding:8px 6px">Rekening</th><th style="text-align:right;padding:8px 6px">Bedrag</th></tr></thead><tbody>${deductions.map(t=>`<tr><td style="padding:9px 6px;border-top:1px solid var(--border)">${new Date(t.date+"T12:00:00").toLocaleDateString("nl-NL")}</td><td style="padding:9px 6px;border-top:1px solid var(--border)">${esc(t.description)}</td><td style="padding:9px 6px;border-top:1px solid var(--border)">${esc(accountById(t.accountId)?.name||"-")}</td><td style="padding:9px 6px;border-top:1px solid var(--border);text-align:right" class="negative">-${euro(t.amount)}</td></tr>`).join("")}</tbody></table></div>`:`<div class="empty">Nog geen vaste kosten afgeschreven.</div>`}</div>`;
})()}`;
$("saveWeeklySalary").onclick=()=>{
  const amount=Number($("weeklySalaryAmount").value);
  const accountId=$("weeklySalaryAccount").value;
  const enabled=$("weeklySalaryEnabled").checked;
  if(enabled && (!Number.isFinite(amount)||amount<=0)){notify("Vul een geldig loonbedrag in.");return}
  data.weeklySalary={enabled,amount:amount||0,accountId,description:"Wekelijks loon"};
  persist();
  render();
  notify(enabled?"Wekelijks loon opgeslagen.":"Wekelijks loon uitgeschakeld.");
};
let kind="expense";
document.querySelectorAll("[data-reckind]").forEach(b=>b.onclick=()=>{kind=b.dataset.reckind;document.querySelectorAll("[data-reckind]").forEach(x=>x.classList.toggle("active",x===b))});
$("recForm").onsubmit=e=>{e.preventDefault();const amount=Number($("recAmount").value);if(!Number.isFinite(amount)||amount<=0){notify("Controleer het bedrag.");return}const day=Math.min(31,Math.max(1,Math.floor(Number($("recDay").value)||1)));const description=$("recDesc").value.trim();if(!description){notify("Vul een omschrijving in.");return}data.recurring.push({id:uid(),description,amount,category:$("recCat").value,accountId:$("recAcc").value,day,kind});saveAndRender()};
document.querySelectorAll("[data-rec-edit-day]").forEach(b=>b.onclick=()=>{
  const i=Number(b.dataset.recEditDay);
  const r=data.recurring[i];
  if(!r)return;
  const currentDay=Number(r.day||1);
  const input=prompt(`Op welke dag van de maand moet \"${r.description}\" worden verwerkt? (1 t/m 31)`,String(currentDay));
  if(input===null)return;
  const day=Number(String(input).replace(",","."));
  if(!Number.isFinite(day)||day<1||day>31||!Number.isInteger(day)){notify("Kies een hele dag tussen 1 en 31.");return}
  r.day=day;
  saveAndRender();
  notify(`Dag aangepast naar ${day}.`);
});
document.querySelectorAll("[data-rec-delete]").forEach(b=>b.onclick=()=>{if(confirm("Terugkerende transactie verwijderen?")){data.recurring.splice(Number(b.dataset.recDelete),1);saveAndRender()}});
}


function processWeeklySalary(){
  const ws=data.weeklySalary;
  if(!ws || !ws.enabled || !(Number(ws.amount)>0)) return;
  const now=new Date();
  const day=now.getDay();
  if(day===0 || day===1 || day===2) return;

  // The salary belongs to this week's Wednesday. If the app is opened later
  // in the week, it is still added once for that Wednesday.
  const wednesday=new Date(now);
  wednesday.setDate(now.getDate()-(day-3));
  const dateKey=`${wednesday.getFullYear()}-${String(wednesday.getMonth()+1).padStart(2,"0")}-${String(wednesday.getDate()).padStart(2,"0")}`;
  const key=`salary_${dateKey}`;
  if(data.processedRecurring[key]) return;

  const acc=accountById(ws.accountId)||data.accounts[0];
  if(!acc) return;

  const amount=Number(ws.amount);
  data.transactions.push({
    id:uid(),
    description:ws.description||"Wekelijks loon",
    amount,
    date:dateKey,
    category:"Salaris",
    accountId:acc.id,
    kind:"income"
  });
  acc.balance+=amount;
  data.processedRecurring[key]=true;
  persist();
}

function downloadBackup(){
try{
const backup={app:"Budget Planner",version:2,createdAt:new Date().toISOString(),data:data};
const blob=new Blob([JSON.stringify(backup,null,2)],{type:"application/json"});
const url=URL.createObjectURL(blob);
const a=document.createElement("a");
a.href=url;
a.download=`BudgetPlanner-backup-${new Date().toISOString().slice(0,10)}.json`;
document.body.appendChild(a);
a.click();
a.remove();
setTimeout(()=>URL.revokeObjectURL(url),1000);
}catch(e){notify("De backup kon niet worden gemaakt.");}
}

function restoreBackup(file){
if(!file)return;
const reader=new FileReader();
reader.onload=()=>{
try{
const parsed=JSON.parse(reader.result);
const restored=parsed?.data||parsed;
if(!restored||typeof restored!=="object"||!Array.isArray(restored.accounts)||!Array.isArray(restored.transactions))throw new Error();
if(!confirm("Deze backup terugzetten? De huidige gegevens in deze browser worden vervangen."))return;
localStorage.setItem(STORAGE_KEY,JSON.stringify(restored));
data=loadData();
render();
notify("Backup succesvol hersteld.");
}catch(e){notify("Dit bestand is geen geldige Budget Planner-backup.");}
};
reader.onerror=()=>notify("Het backupbestand kon niet worden gelezen.");
reader.readAsText(file);
}

function setupBackupControls(){
$("backupDownload").onclick=downloadBackup;
$("backupRestore").onclick=()=>$("backupFile").click();
$("backupFile").onchange=e=>{restoreBackup(e.target.files?.[0]);e.target.value="";};

const mobileBackup=$("mobileBackup");
const mobileMenu=$("mobileBackupMenu");
if(mobileBackup&&mobileMenu){
  mobileBackup.onclick=()=>{
    mobileMenu.style.display=mobileMenu.style.display==="none"?"block":"none";
  };
  $("mobileBackupDownload").onclick=()=>{
    downloadBackup();
    mobileMenu.style.display="none";
  };
  $("mobileBackupRestore").onclick=()=>{
    $("backupFile").click();
    mobileMenu.style.display="none";
  };
}
}

function init(){
processRecurringTransactions();
processWeeklySalary();
navEvents();
setupGlobalControls();
setupBackupControls();
render();
}
init();
</script>
